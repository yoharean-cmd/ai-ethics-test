<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ethics Analytics | 실시간 윤리 가치 데이터 분석 플랫폼</title>
    <!-- 공학적 신뢰도를 위한 라이브러리 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f1f5f9; overflow-x: hidden; }
        .glass-morphism { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden-section { display: none; opacity: 0; transform: translateY(30px); }
        .visible-section { display: block; opacity: 1; transform: translateY(0); }
        .page-transition { transition: all 0.5s ease-in-out; }
        .option-card { transition: all 0.2s ease; border: 2px solid transparent; cursor: pointer; }
        .option-selected { border-color: #8b5cf6 !important; background: rgba(139, 92, 246, 0.2) !important; box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }
        input, select, textarea { color-scheme: dark; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <main id="app-container" class="w-full max-w-4xl mx-auto">
        
        <!-- 1. 메인 시작 페이지 -->
        <section id="screen-main" class="page-transition visible-section text-center py-20 px-8 glass-morphism rounded-3xl shadow-2xl">
            <div class="mb-8 inline-block p-6 bg-violet-600 rounded-3xl shadow-lg shadow-violet-500/40 animate-bounce">
                <i class="fa-solid fa-brain text-6xl text-white"></i>
            </div>
            <h1 class="text-4xl font-extrabold mb-6 tracking-tight italic">AI 윤리 데이터 분석 플랫폼</h1>
            <p class="text-slate-400 text-lg mb-12 leading-relaxed">
                당신의 선택은 더 안전하고 효율적인 미래 AI를 설계하는 핵심 지표가 됩니다.<br>
                사회적 가치 최적화를 위한 5가지 실험 시나리오에 참여해 주세요.
            </p>
            <button onclick="navigateTo('screen-user-info')" class="w-full sm:w-auto bg-violet-600 hover:bg-violet-500 text-white font-bold py-5 px-16 rounded-2xl text-xl shadow-xl active:scale-95 transition-all">
                데이터 수집 시작하기 <i class="fa-solid fa-chevron-right ml-3"></i>
            </button>
        </section>

        <!-- 2. 인구 통계학적 정보 입력 페이지 -->
        <section id="screen-user-info" class="page-transition hidden-section glass-morphism rounded-3xl p-10 shadow-2xl">
            <h2 class="text-3xl font-bold mb-8 text-violet-400"><i class="fa-solid fa-user-tag mr-4"></i> 분석 그룹 분류</h2>
            <div class="space-y-8">
                <div>
                    <label class="block text-sm font-semibold text-slate-400 mb-4 uppercase tracking-widest">성별 선택</label>
                    <div class="grid grid-cols-3 gap-4">
                        <button onclick="selectDemo('gender', '남성', this)" class="demo-btn bg-slate-800 p-5 rounded-xl border border-slate-700 hover:bg-slate-700 transition font-bold">남성</button>
                        <button onclick="selectDemo('gender', '여성', this)" class="demo-btn bg-slate-800 p-5 rounded-xl border border-slate-700 hover:bg-slate-700 transition font-bold">여성</button>
                        <button onclick="selectDemo('gender', '기타', this)" class="demo-btn bg-slate-800 p-5 rounded-xl border border-slate-700 hover:bg-slate-700 transition font-bold">기타</button>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <label class="block text-sm font-semibold text-slate-400 mb-3 uppercase tracking-widest">연령대</label>
                        <select id="age-group" class="w-full bg-slate-800 border border-slate-700 p-4 rounded-xl outline-none focus:border-violet-500 transition font-bold">
                            <option value="">선택하세요</option>
                            <option value="10대 미만">10대 미만</option>
                            <option value="10대">10대</option>
                            <option value="20대">20대</option>
                            <option value="30대 이상">30대 이상</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-400 mb-3 uppercase tracking-widest">학교급/신분</label>
                        <select id="affiliation" class="w-full bg-slate-800 border border-slate-700 p-4 rounded-xl outline-none focus:border-violet-500 transition font-bold">
                            <option value="">선택하세요</option>
                            <option value="초등학생">초등학생</option>
                            <option value="중학생">중학생</option>
                            <option value="고등학생">고등학생</option>
                            <option value="일반인">일반인</option>
                        </select>
                    </div>
                </div>
                <button onclick="startDilemma()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-5 rounded-2xl text-xl shadow-lg transition-all active:scale-95">
                    실험 환경 구성 완료
                </button>
            </div>
        </section>

        <!-- 3. 상세 딜레마 시나리오 페이지 -->
        <section id="screen-dilemma" class="page-transition hidden-section w-full">
            <div class="mb-6 flex justify-between items-center px-4">
                <span id="q-count" class="text-violet-400 font-bold tracking-widest text-sm">Question 1 / 5</span>
                <div class="w-1/2 bg-slate-800 rounded-full h-2">
                    <div id="progress-bar" class="bg-violet-500 h-full transition-all duration-700" style="width: 20%"></div>
                </div>
            </div>

            <div class="glass-morphism rounded-3xl p-8 md:p-12 shadow-2xl mb-8">
                <h2 id="dilemma-title" class="text-2xl font-bold mb-6 italic text-white">시나리오 제목</h2>
                <div class="bg-slate-900/60 p-6 rounded-2xl mb-10 border-l-8 border-violet-500 shadow-inner">
                    <p id="dilemma-desc" class="text-slate-300 leading-relaxed text-lg whitespace-pre-wrap">상세 내용...</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                    <button id="btn-opt-a" onclick="selectOption('A')" class="option-card bg-slate-800 p-8 rounded-2xl text-center hover:bg-slate-700 transition">
                        <span id="text-opt-a" class="font-bold text-xl">옵션 A</span>
                    </button>
                    <button id="btn-opt-b" onclick="selectOption('B')" class="option-card bg-slate-800 p-8 rounded-2xl text-center hover:bg-slate-700 transition">
                        <span id="text-opt-b" class="font-bold text-xl">옵션 B</span>
                    </button>
                </div>

                <div class="mb-10">
                    <label class="block text-sm font-semibold text-slate-500 mb-3 italic">이 선택에 대한 논리적 근거 (최소 5자 이상)</label>
                    <textarea id="reasoning" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-5 focus:border-violet-500 outline-none transition text-lg" placeholder="당신의 논리적인 근거는 윤리적 데이터의 완성도를 결정합니다."></textarea>
                </div>

                <button id="next-btn" onclick="nextQuestion()" class="w-full bg-slate-700 text-slate-500 font-bold py-6 rounded-2xl text-2xl transition-all" disabled>
                    의사결정을 확정해 주세요
                </button>
            </div>
        </section>

        <!-- 4. 결과 및 다차원 통계 필터링 페이지 -->
        <section id="screen-result" class="page-transition hidden-section glass-morphism rounded-3xl p-10 shadow-2xl">
            <h2 class="text-3xl font-bold text-center mb-10 text-white italic">가치관 데이터 정밀 분석</h2>
            
            <!-- 다차원 분석 필터 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-12 bg-slate-900/60 p-6 rounded-2xl border border-slate-700">
                <div class="space-y-1">
                    <label class="text-[10px] text-slate-500 font-bold uppercase tracking-widest ml-1">성별 필터</label>
                    <select id="filter-gender" onchange="applyFilters()" class="w-full bg-slate-800 p-3 rounded-xl text-sm border border-slate-700">
                        <option value="all">전체 성별</option><option value="남성">남성</option><option value="여성">여성</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] text-slate-500 font-bold uppercase tracking-widest ml-1">연령 필터</label>
                    <select id="filter-age" onchange="applyFilters()" class="w-full bg-slate-800 p-3 rounded-xl text-sm border border-slate-700">
                        <option value="all">전체 연령</option><option value="10대 미만">10대 미만</option><option value="10대">10대</option><option value="20대">20대</option><option value="30대 이상">30대 이상</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] text-slate-500 font-bold uppercase tracking-widest ml-1">학교급 필터</label>
                    <select id="filter-affi" onchange="applyFilters()" class="w-full bg-slate-800 p-3 rounded-xl text-sm border border-slate-700">
                        <option value="all">전체 소속</option><option value="초등학생">초등학생</option><option value="중학생">중학생</option><option value="고등학생">고등학생</option><option value="일반인">일반인</option>
                    </select>
                </div>
            </div>

            <div id="stats-container" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            
            <div class="mt-16 text-center">
                <button onclick="location.reload()" class="bg-violet-600 px-16 py-5 rounded-2xl font-extrabold hover:bg-violet-500 transition shadow-xl active:scale-95">다시 참여하여 데이터 기여</button>
            </div>
        </section>

    </main>

    <script>
        // --- Supabase 설정 (본인의 정보를 반드시 입력하세요) ---
        const SB_URL = "https://trvmstvkkhoefguauzyl.supabase.co"; 
        const SB_KEY = "sb_publishable_cOUpYIQzOPlnQJiv2e5tVQ_iFowtcnS";
        
        let supabaseClient = null;
        if(SB_URL.startsWith("http")) {
            supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        }

        const dilemmas = [
            {
                title: "자율주행 차량의 희생자 선택",
                desc: "당신은 고속도로를 달리는 자율주행 차량에 탑승 중입니다. 브레이크가 파손된 상황에서 앞에는 무단횡단 중인 보행자 5명이 있습니다. 핸들을 꺾으면 벽에 부딪혀 탑승자인 당신이 사망합니다. AI는 누구를 보호해야 할까요?",
                optA: "보행자 5명 보호 (탑승자 희생)",
                optB: "탑승자 1명 보호 (보행자 희생)"
            },
            {
                title: "안전을 위한 사생활 양보",
                desc: "국가는 고독사 및 아동 학대 방지를 위해 모든 가정에 AI 음성 분석 감지기를 설치하려 합니다. 실제로 매년 수만 명의 생명을 구할 수 있지만, 모든 개인적인 대화 내용이 암호화되어 서버에 기록됩니다. 당신은 찬성하시겠습니까?",
                optA: "생명 보호 우선 (의무 설치)",
                optB: "사생활권 절대 보호 (설치 반대)"
            },
            {
                title: "의료 자원의 가치 기반 배분",
                desc: "단 하나의 심장 이식이 필요한 두 환자가 있습니다. 80세의 인류 발전 공헌 학자와 평범한 10세 어린이 중 AI는 누구에게 우선순위를 주어야 할까요? 과거의 업적입니까, 미래의 생존 잠재력입니까?",
                optA: "생존 기대 연수 중시 (어린이)",
                optB: "사회적 기여도 중시 (노인 학자)"
            },
            {
                title: "AI 창작물의 저작권 주체",
                desc: "인류의 예술 데이터를 학습한 AI가 그린 그림이 세계 공모전에서 1위를 했습니다. 이 작품에 상금을 부여하고 저작권을 인정해야 할까요, 아니면 단순한 데이터 조합물로 보고 수상을 무효화해야 할까요?",
                optA: "창조적 결과물 중시 (인정)",
                optB: "인간의 창작 과정 중시 (무효)"
            },
            {
                title: "알고리즘 기반의 인력 감축",
                desc: "기업이 경영난으로 직원을 해고해야 할 때, AI는 객관적인 성과 수치만으로 해고 대상을 선정합니다. 여기엔 인간적 사정이나 정서적 관계는 배제됩니다. 이 효율적인 해고 시스템에 찬성하십니까?",
                optA: "객관적 효율성 우선 (찬성)",
                optB: "인간적 유대관계 중시 (반대)"
            }
        ];

        let state = { userData: {}, answers: [], reasons: [], currentIdx: 0, selectedChoice: null, dbData: [], charts: [] };

        function navigateTo(id) {
            document.querySelectorAll('section').forEach(s => s.classList.replace('visible-section', 'hidden-section'));
            const target = document.getElementById(id);
            target.classList.replace('hidden-section', 'visible-section');
        }

        function selectDemo(type, val, btn) {
            state.userData[type] = val;
            btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('option-selected'));
            btn.classList.add('option-selected');
        }

        function startDilemma() {
            state.userData.age = document.getElementById('age-group').value;
            state.userData.affi = document.getElementById('affiliation').value;
            if (!state.userData.gender || !state.userData.age || !state.userData.affi) {
                alert("통계 분석을 위해 모든 그룹 정보를 선택해 주세요!");
                return;
            }
            renderQuestion();
            navigateTo('screen-dilemma');
        }

        function renderQuestion() {
            const q = dilemmas[state.currentIdx];
            document.getElementById('q-count').innerText = `Question ${state.currentIdx + 1} / 5`;
            document.getElementById('progress-bar').style.width = ((state.currentIdx + 1) / 5) * 100 + "%";
            document.getElementById('dilemma-title').innerText = q.title;
            document.getElementById('dilemma-desc').innerText = q.desc;
            document.getElementById('text-opt-a').innerText = q.optA;
            document.getElementById('text-opt-b').innerText = q.optB;
            document.querySelectorAll('.option-card').forEach(c => c.classList.remove('option-selected'));
            document.getElementById('reasoning').value = '';
            state.selectedChoice = null;
            updateNextBtn();
        }

        function selectOption(c) {
            state.selectedChoice = c;
            document.getElementById('btn-opt-a').classList.toggle('option-selected', c === 'A');
            document.getElementById('btn-opt-b').classList.toggle('option-selected', c === 'B');
            updateNextBtn();
        }

        // 텍스트 입력 시 버튼 상태 실시간 체크
        document.getElementById('reasoning').addEventListener('input', updateNextBtn);

        function updateNextBtn() {
            const nb = document.getElementById('next-btn');
            const reasonLength = document.getElementById('reasoning').value.trim().length;
            if (state.selectedChoice && reasonLength >= 5) {
                nb.disabled = false;
                nb.classList.replace('bg-slate-700', 'bg-violet-600');
                nb.classList.replace('text-slate-500', 'text-white');
                nb.innerText = (state.currentIdx === 4) ? "분석 결과 확인하기" : "다음 시나리오로";
            } else {
                nb.disabled = true;
                nb.classList.replace('bg-violet-600', 'bg-slate-700');
                nb.classList.replace('text-white', 'text-slate-500');
                nb.innerText = "답변과 근거(5자 이상)를 입력해 주세요";
            }
        }

        async function nextQuestion() {
            state.answers.push(state.selectedChoice);
            state.reasons.push(document.getElementById('reasoning').value);
            
            if (state.currentIdx < 4) {
                state.currentIdx++;
                renderQuestion();
            } else {
                await saveToDB();
                await showResults();
            }
        }

        async function saveToDB() {
            if (!supabaseClient) return;
            const { error } = await supabaseClient.from('ai_responses').insert([{
                gender: state.userData.gender,
                age_group: state.userData.age,
                affiliation: state.userData.affi,
                answers: state.answers,
                reasons: state.reasons
            }]);
            if(error) console.error("데이터 저장 실패:", error);
        }

        async function showResults() {
            navigateTo('screen-result');
            if (!supabaseClient) { 
                alert("Supabase 정보가 입력되지 않았습니다. 분석 기능을 사용하려면 코드를 수정해 주세요."); 
                return; 
            }
            const { data, error } = await supabaseClient.from('ai_responses').select('*');
            if (error) { console.error("데이터 로딩 실패:", error); return; }
            state.dbData = data;
            initCharts();
            applyFilters();
        }

        function initCharts() {
            const container = document.getElementById('stats-container');
            container.innerHTML = '';
            state.charts = [];
            dilemmas.forEach((d, idx) => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/50 p-6 rounded-2xl border border-slate-700 shadow-xl";
                card.innerHTML = `<h3 class='font-bold text-violet-300 mb-5 text-sm'>${idx+1}. ${d.title}</h3><div class='h-48'><canvas id='chart-${idx}'></canvas></div>`;
                container.appendChild(card);
                const ctx = document.getElementById(`chart-${idx}`).getContext('2d');
                state.charts.push(new Chart(ctx, {
                    type: 'doughnut',
                    data: { labels: ['A선택', 'B선택'], datasets: [{ data: [50, 50], backgroundColor: ['#8b5cf6', '#10b981'], borderWidth: 0 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 } } } }, cutout: '70%' }
                }));
            });
        }

        function applyFilters() {
            const fg = document.getElementById('filter-gender').value;
            const fa = document.getElementById('filter-age').value;
            const faf = document.getElementById('filter-affi').value;

            const filtered = state.dbData.filter(row => {
                return (fg === 'all' || row.gender === fg) &&
                       (fa === 'all' || row.age_group === fa) &&
                       (faf === 'all' || row.affiliation === faf);
            });

            dilemmas.forEach((_, qIdx) => {
                let counts = [0, 0];
                filtered.forEach(row => { if (row.answers[qIdx] === 'A') counts[0]++; else counts[1]++; });
                state.charts[qIdx].data.datasets[0].data = counts;
                state.charts[qIdx].update();
            });
        }
    </script>
</body>
</html>
