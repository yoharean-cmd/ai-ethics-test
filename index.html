<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 윤리 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass-morphism { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden-section { display: none; }
        .option-selected { border: 2px solid #8b5cf6 !important; background: rgba(139, 92, 246, 0.2) !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-4xl mx-auto">
        <!-- 메인 페이지 -->
        <section id="screen-main" class="text-center py-16 px-8 glass-morphism rounded-3xl shadow-2xl">
            <h1 class="text-4xl font-extrabold mb-6">AI 윤리 데이터 분석 플랫폼</h1>
            <button onclick="navigateTo('screen-user-info')" class="bg-violet-600 hover:bg-violet-500 text-white font-bold py-5 px-16 rounded-2xl text-xl">입장하기</button>
        </section>

        <!-- 정보 입력 페이지 -->
        <section id="screen-user-info" class="hidden-section glass-morphism rounded-3xl p-10 shadow-2xl">
            <h2 class="text-2xl font-bold mb-8 text-violet-400">분석 그룹 분류</h2>
            <div class="space-y-8">
                <div>
                    <p class="text-sm text-slate-400 mb-3">성별 (클릭하여 선택)</p>
                    <div class="grid grid-cols-3 gap-4">
                        <button onclick="selectDemo('gender', '남성', this)" class="demo-btn bg-slate-800 p-4 rounded-xl border border-slate-700">남성</button>
                        <button onclick="selectDemo('gender', '여성', this)" class="demo-btn bg-slate-800 p-4 rounded-xl border border-slate-700">여성</button>
                        <button onclick="selectDemo('gender', '기타', this)" class="demo-btn bg-slate-800 p-4 rounded-xl border border-slate-700">기타</button>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <select id="age-group" class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-white"><option value="">연령대 선택</option><option value="10대">10대</option><option value="20대">20대</option><option value="30대">30대</option></select>
                    <select id="affiliation" class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-white"><option value="">학교급 선택</option><option value="초등학생">초등학생</option><option value="중학생">중학생</option><option value="고등학생">고등학생</option><option value="일반인">일반인</option></select>
                </div>
                <button onclick="startDilemma()" class="w-full bg-emerald-600 font-bold py-5 rounded-2xl text-xl">실험 입장하기</button>
            </div>
        </section>

        <!-- 딜레마 페이지 (간략화) -->
        <section id="screen-dilemma" class="hidden-section glass-morphism rounded-3xl p-10 shadow-2xl text-center">
            <h2 id="d-title" class="text-2xl font-bold mb-4">시나리오 진행 중</h2>
            <p id="d-desc" class="mb-10 text-slate-300">내용...</p>
            <div class="grid gap-4">
                <button onclick="selectOption('A')" id="btn-a" class="bg-slate-800 p-6 rounded-xl border border-slate-700">옵션 A</button>
                <button onclick="selectOption('B')" id="btn-b" class="bg-slate-800 p-6 rounded-xl border border-slate-700">옵션 B</button>
            </div>
            <button id="next-btn" onclick="nextQuestion()" class="w-full mt-10 bg-violet-600 py-4 rounded-xl opacity-50" disabled>답변을 선택하세요</button>
        </section>
    </main>

    <script>
        // --- 중요: Supabase 연동 시도 (실패해도 앱이 멈추지 않게 처리) ---
        let supabaseClient = null;
        try {
            const SB_URL = "YOUR_SUPABASE_URL"; // 실제 URL로 교체 필요
            const SB_KEY = "YOUR_SUPABASE_ANON_KEY"; // 실제 Key로 교체 필요
            if(SB_URL.startsWith("http")) {
                supabaseClient = supabase.createClient(SB_URL, SB_KEY);
            }
        } catch(e) { console.error("Supabase 초기화 실패:", e); }

        let state = { userData: {}, answers: [], currentIdx: 0, selectedChoice: null };
        const questions = [
            { title: "자율주행 사고", desc: "보행자를 칠 것인가 탑승자가 희생할 것인가?", optA: "보행자 보호", optB: "탑승자 보호" },
            { title: "AI 감시", desc: "안전을 위해 모든 대화를 AI가 기록해도 될까요?", optA: "찬성", optB: "반대" }
        ];

        function navigateTo(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden-section'));
            document.getElementById(id).classList.remove('hidden-section');
        }

        function selectDemo(type, val, btn) {
            state.userData[type] = val;
            btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('option-selected'));
            btn.classList.add('option-selected');
        }

        function startDilemma() {
            state.userData.age = document.getElementById('age-group').value;
            state.userData.affi = document.getElementById('affiliation').value;
            
            // 모든 항목 선택 여부 확인
            if (!state.userData.gender || !state.userData.age || !state.userData.affi) {
                alert("성별, 연령대, 학교급을 모두 선택해 주세요!");
                return;
            }
            renderQuestion();
            navigateTo('screen-dilemma');
        }

        function renderQuestion() {
            const q = questions[state.currentIdx];
            document.getElementById('d-title').innerText = q.title;
            document.getElementById('d-desc').innerText = q.desc;
            document.getElementById('btn-a').innerText = q.optA;
            document.getElementById('btn-b').innerText = q.optB;
            document.getElementById('btn-a').classList.remove('option-selected');
            document.getElementById('btn-b').classList.remove('option-selected');
            document.getElementById('next-btn').disabled = true;
            document.getElementById('next-btn').classList.add('opacity-50');
        }

        function selectOption(c) {
            state.selectedChoice = c;
            document.getElementById('btn-a').classList.toggle('option-selected', c==='A');
            document.getElementById('btn-b').classList.toggle('option-selected', c==='B');
            document.getElementById('next-btn').disabled = false;
            document.getElementById('next-btn').classList.remove('opacity-50');
        }

        function nextQuestion() {
            state.answers.push(state.selectedChoice);
            if(state.currentIdx < questions.length - 1) {
                state.currentIdx++;
                renderQuestion();
            } else {
                alert("모든 테스트가 완료되었습니다! (DB 연동 시 통계 화면으로 이동)");
                location.reload();
            }
        }
    </script>
</body>
</html>
