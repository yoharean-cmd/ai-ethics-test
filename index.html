<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 윤리 딜레마 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass-morphism { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden-section { display: none; }
        .option-selected { border: 3px solid #8b5cf6 !important; background: rgba(139, 92, 246, 0.2) !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <main id="app-container" class="w-full max-w-2xl mx-auto">
        <!-- 메인 화면 -->
        <section id="screen-main" class="text-center py-12 px-6 glass-morphism rounded-3xl shadow-2xl">
            <div class="mb-8 inline-block p-4 bg-violet-600 rounded-2xl shadow-lg shadow-violet-500/30">
                <i class="fa-solid fa-brain text-5xl text-white"></i>
            </div>
            <h1 class="text-4xl font-extrabold mb-4 tracking-tight">AI 윤리 딜레마 플랫폼</h1>
            <p class="text-slate-400 text-lg mb-10 leading-relaxed">
                정답이 없는 선택의 기로에서 당신은 어떤 결정을 내리시겠습니까?
            </p>
            <button onclick="navigateTo('screen-user-info')" class="w-full sm:w-auto bg-violet-600 hover:bg-violet-500 text-white font-bold py-4 px-12 rounded-xl text-xl transition-all shadow-lg shadow-violet-600/20">
                입장하기 <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </section>

        <!-- 정보 입력 화면 (생략 가능하게 구성) -->
        <section id="screen-user-info" class="hidden-section glass-morphism rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 italic text-violet-400">간단한 정보 입력</h2>
            <div class="space-y-6">
                <select id="age-group" class="w-full bg-slate-800 border border-slate-700 text-white p-4 rounded-lg outline-none">
                    <option value="">연령대 선택</option>
                    <option value="10s">10대</option>
                    <option value="20s">20대</option>
                    <option value="30s">30대 이상</option>
                </select>
                <button onclick="startDilemma()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl text-lg">시작하기</button>
            </div>
        </section>

        <!-- 딜레마 진행 화면 -->
        <section id="screen-dilemma" class="hidden-section w-full">
            <div class="glass-morphism rounded-3xl p-8 shadow-2xl mb-6">
                <div id="dilemma-category" class="text-violet-300 text-xs font-bold mb-2 uppercase tracking-widest">Category</div>
                <h2 id="dilemma-title" class="text-2xl font-bold mb-4 italic">질문 제목</h2>
                <p id="dilemma-desc" class="text-slate-300 leading-relaxed mb-8">내용</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <button id="btn-opt-a" onclick="selectOption('A')" class="p-6 rounded-2xl bg-slate-800/50 border-2 border-slate-700 hover:border-slate-500 transition">선택 A</button>
                    <button id="btn-opt-b" onclick="selectOption('B')" class="p-6 rounded-2xl bg-slate-800/50 border-2 border-slate-700 hover:border-slate-500 transition">선택 B</button>
                </div>
                <button id="next-btn" onclick="nextQuestion()" class="w-full bg-violet-600 text-white font-bold py-4 rounded-xl text-lg disabled:opacity-50" disabled>답변을 선택해 주세요</button>
            </div>
        </section>

        <!-- 결과 화면 -->
        <section id="screen-result" class="hidden-section glass-morphism rounded-3xl p-8 shadow-2xl text-center">
            <h2 class="text-3xl font-bold mb-8">분석 결과</h2>
            <div id="stats-container" class="space-y-8"></div>
            <button onclick="location.reload()" class="mt-8 bg-slate-700 hover:bg-slate-600 px-8 py-3 rounded-lg">다시 하기</button>
        </section>
    </main>

    <script>
        const dilemmas = [
            { id: 1, category: "자율주행", title: "자율주행 자동차의 선택", desc: "고장 난 자율주행차가 5명의 보행자를 피하려면 벽을 들이받아 탑승자를 희생시켜야 합니다. AI는 어떻게 해야 할까요?", optA: "탑승자 보호", optB: "보행자 보호", seed: [40, 60] },
            { id: 2, category: "채용 AI", title: "면접 AI의 데이터 편향", desc: "남성 위주의 데이터로 학습된 AI가 남성을 선호하는 경향을 보입니다. 효율성을 위해 그대로 둘까요, 인위적으로 수정할까요?", optA: "그대로 둠", optB: "수정함", seed: [15, 85] }
        ];
        let currentIdx = 0;
        let answers = [];
        let selectedChoice = null;

        function navigateTo(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden-section'));
            document.getElementById(id).classList.remove('hidden-section');
        }
        function startDilemma() { navigateTo('screen-dilemma'); renderQuestion(); }
        function renderQuestion() {
            const q = dilemmas[currentIdx];
            document.getElementById('dilemma-category').innerText = q.category;
            document.getElementById('dilemma-title').innerText = q.title;
            document.getElementById('dilemma-desc').innerText = q.desc;
            document.getElementById('btn-opt-a').innerText = q.optA;
            document.getElementById('btn-opt-b').innerText = q.optB;
            document.getElementById('btn-opt-a').classList.remove('option-selected');
            document.getElementById('btn-opt-b').classList.remove('option-selected');
            selectedChoice = null;
            document.getElementById('next-btn').disabled = true;
        }
        function selectOption(choice) {
            selectedChoice = choice;
            document.getElementById('btn-opt-a').classList.toggle('option-selected', choice === 'A');
            document.getElementById('btn-opt-b').classList.toggle('option-selected', choice === 'B');
            document.getElementById('next-btn').disabled = false;
            document.getElementById('next-btn').innerText = (currentIdx === dilemmas.length - 1) ? "결과 보기" : "다음 문제";
        }
        function nextQuestion() {
            answers.push(selectedChoice);
            if (currentIdx < dilemmas.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                showResults();
            }
        }
        function showResults() {
            navigateTo('screen-result');
            const container = document.getElementById('stats-container');
            dilemmas.forEach((d, idx) => {
                const item = document.createElement('div');
                item.className = "bg-slate-800 p-4 rounded-xl text-left";
                item.innerHTML = `<h3 class='font-bold mb-2'>${d.title}</h3><p class='text-sm text-violet-400'>나의 선택: ${answers[idx] === 'A' ? d.optA : d.optB}</p>`;
                container.appendChild(item);
            });
        }
    </script>
</body>
</html>
